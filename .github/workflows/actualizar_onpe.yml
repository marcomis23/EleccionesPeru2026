name: Actualizador ONPE

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Librerías
        run: pip install requests

      - name: Scrapping
        run: python scrapper_onpe.py

      - name: Push Changes
        run: |
          git config --global user.name 'Robot ONPE'
          git config --global user.email 'action@github.com'
          git add onpe_data.json
          git commit -m "Auto-update ONPE $(date)" || echo "No changes"
          git push

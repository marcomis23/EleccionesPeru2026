<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Electoral - ONPE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .progress-bar { transition: width 1.5s ease-in-out; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 italic uppercase">Resultados ONPE en Vivo</h1>
                <p id="fecha-actualizacion" class="text-slate-500 font-medium">Sincronizando datos...</p>
            </div>
            <div class="bg-blue-600 text-white px-6 py-3 rounded-2xl card-shadow flex items-center gap-3">
                <i class="fa-solid fa-box-archive text-2xl"></i>
                <div>
                    <p class="text-xs opacity-80 uppercase font-bold tracking-wider">Actas Contabilizadas</p>
                    <p id="porcentaje-actas" class="text-2xl font-black">0%</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 md:p-8 card-shadow mb-8 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-chart-simple text-blue-600"></i>
                Votos por Candidato (Top 5)
            </h2>
            <div id="contenedor-candidatos" class="space-y-6">
                <div class="animate-pulse space-y-4">
                    <div class="h-4 bg-slate-200 rounded w-1/4"></div>
                    <div class="h-8 bg-slate-200 rounded-full"></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-sm">Estado de Fuente</p>
                <p id="fuente-dato" class="text-sm font-bold text-blue-600">Verificando...</p>
            </div>
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-sm">Sincronización</p>
                <p class="text-emerald-600 font-bold flex items-center justify-center gap-2">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    Tiempo Real
                </p>
            </div>
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-sm">Modo de Consulta</p>
                <p class="text-slate-700 font-bold">Bypass Directo</p>
            </div>
        </div>
    </div>

    <script>
        async function cargarDatos() {
            try {
                // 1. Intentamos leer el archivo local primero (caché del robot)
                const respuestaLocal = await fetch('./onpe_data.json?v=' + Date.now());
                let d = { data: { actasContabilizadas: 0, candidatos: [] } };
                
                if (respuestaLocal.ok) {
                    const temp = await respuestaLocal.json();
                    d = temp.data;
                }

                // 2. BYPASS: Intentamos jalar data fresca de la ONPE usando un Proxy para evitar el bloqueo CORS
                try {
                    const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent("https://resultadoelectoral.onpe.gob.pe/presentacion-backend/resumen-general/participantes?idEleccion=10&tipoFiltro=eleccion");
                    const resFresco = await fetch(proxyUrl);
                    const jsonFresco = await resFresco.json();
                    const dataFresca = JSON.parse(jsonFresco.contents).data;

                    if (dataFresca && dataFresca.length > 0) {
                        const avanceFresco = dataFresca[0].porcentajeActasContabilizadas;
                        
                        // Si la ONPE tiene datos más nuevos que nuestro archivo local, actualizamos la vista
                        if (parseFloat(avanceFresco) >= parseFloat(d.actasContabilizadas)) {
                            document.getElementById('fuente-dato').innerText = "DIRECTO ONPE";
                            d.actasContabilizadas = avanceFresco;
                            
                            const ordenados = dataFresca.sort((a,b) => b.totalVotosValidos - a.totalVotosValidos);
                            const colores = ["#f97316", "#ef4444", "#fbbf24", "#3b82f6", "#8b5cf6"];
                            
                            d.candidatos = ordenados.slice(0,5).map((c, i) => ({
                                nombre: c.nombreCandidato,
                                votos: c.totalVotosValidos,
                                porcentaje: c.porcentajeVotosValidos,
                                color: colores[i]
                            }));
                        }
                    }
                } catch (e) {
                    console.log("Error en bypass, usando respaldo local.");
                    document.getElementById('fuente-dato').innerText = "ARCHIVO LOCAL";
                }

                // --- RENDERIZADO EN PANTALLA ---
                document.getElementById('porcentaje-actas').innerText = d.actasContabilizadas + '%';
                const fecha = new Date();
                document.getElementById('fecha-actualizacion').innerText = 'Última consulta: ' + fecha.toLocaleString('es-PE');
                
                const contenedor = document.getElementById('contenedor-candidatos');
                contenedor.innerHTML = ''; 

                d.candidatos.forEach(c => {
                    contenedor.innerHTML += `
                        <div>
                            <div class="flex justify-between items-end mb-2">
                                <div>
                                    <span class="block text-sm font-bold text-slate-800 uppercase tracking-tight">${c.nombre}</span>
                                    <span class="text-xs text-slate-400 font-medium">${Number(c.votos).toLocaleString()} VOTOS</span>
                                </div>
                                <span class="text-lg font-black text-slate-800">${c.porcentaje}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden border border-slate-200">
                                <div class="progress-bar h-full rounded-full" 
                                     style="width: ${c.porcentaje}%; background-color: ${c.color};">
                                </div>
                            </div>
                        </div>`;
                });

            } catch (error) {
                console.error("Error crítico:", error);
            }
        }

        // Ejecutar al abrir y cada 60 segundos
        cargarDatos();
        setInterval(cargarDatos, 60000);
    </script>
</body>
</html>

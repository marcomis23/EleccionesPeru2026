<script>
    async function cargarDatos() {
        // --- PASO 1: CARGA ULTRA RÁPIDA (LO QUE TENÍAS ANTES) ---
        try {
            const resLocal = await fetch('./onpe_data.json?v=' + Date.now());
            if (resLocal.ok) {
                const local = await resLocal.json();
                const d = local.data || local;
                // Renderizamos de inmediato para que el usuario no espere
                renderizar(d.candidatos, "MEMORIA LOCAL (RÁPIDO)", d.actasContabilizadas);
            }
        } catch (err) { console.log("Fallo carga inicial"); }

        // --- PASO 2: BUSQUEDA EN SEGUNDO PLANO (EL BYPASS) ---
        // Esto se hace "atrás" sin bloquear la vista
        setTimeout(async () => {
            const urlONPE = "https://resultadoelectoral.onpe.gob.pe/presentacion-backend/resumen-general/participantes?idEleccion=10&tipoFiltro=eleccion";
            const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(urlONPE);

            try {
                const response = await fetch(proxy + "&t=" + Date.now());
                const json = await response.json();
                const dataRaw = JSON.parse(json.contents);
                const lista = dataRaw.data || dataRaw.participantes;

                if (lista && lista.length > 0) {
                    // Si encontró data nueva, actualiza los números en vivo
                    renderizar(lista, "ONPE EN VIVO (ACTUALIZADO)");
                }
            } catch (e) {
                console.log("No se pudo conectar a ONPE en vivo, nos quedamos con la data local.");
            }
        }, 500); // Espera medio segundo para no estorbar la carga inicial
    }

    function renderizar(lista, fuente, actasManual = null) {
        if (!lista || lista.length === 0) return;

        const avance = actasManual || lista[0].porcentajeActasContabilizadas || lista[0].avance || "93.359";
        document.getElementById('porcentaje-actas').innerText = avance + '%';
        
        const ordenados = lista.sort((a,b) => (b.totalVotosValidos || b.votosTotales) - (a.totalVotosValidos || a.votosTotales));
        const colores = ["#f97316", "#ef4444", "#fbbf24", "#3b82f6", "#8b5cf6"];
        
        const cont = document.getElementById('contenedor-candidatos');
        cont.innerHTML = ''; 
        
        ordenados.slice(0,5).forEach((c, i) => {
            const nombre = c.nombreCandidato || c.nombreAgrupacionPolitica || c.nombre;
            const votos = c.totalVotosValidos || c.votosTotales || c.votos;
            const porc = c.porcentajeVotosValidos || c.porcentaje;
            
            cont.innerHTML += `
                <div>
                    <div class="flex justify-between items-end mb-4">
                        <div class="flex flex-col">
                            <span class="text-xl font-black italic tracking-tighter uppercase leading-none text-white">${nombre}</span>
                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2">${Number(votos).toLocaleString()} Votos</span>
                        </div>
                        <span class="text-3xl font-black text-white">${porc}%</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-4 p-1 border border-white/5 overflow-hidden">
                        <div class="bar-anim h-full rounded-full" style="width: ${porc}%; background-color: ${colores[i]}; box-shadow: 0 0 20px ${colores[i]}44"></div>
                    </div>
                </div>`;
        });

        document.getElementById('fuente-dato').innerText = fuente;
        document.getElementById('fecha-onpe').innerText = "SINCRO: " + new Date().toLocaleTimeString('es-PE');
        document.getElementById('fecha-consulta').innerText = 'CONSULTA: ' + new Date().toLocaleTimeString('es-PE');
    }

    cargarDatos();
</script>

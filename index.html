<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Electoral - ONPE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .progress-bar { transition: width 1.5s ease-in-out; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 italic">ONPE: RESULTADOS PRESIDENCIALES</h1>
                <p id="fecha-actualizacion" class="text-slate-500 font-medium">Cargando última actualización...</p>
            </div>
            <div class="bg-blue-600 text-white px-6 py-3 rounded-2xl card-shadow flex items-center gap-3">
                <i class="fa-solid fa-box-archive text-2xl"></i>
                <div>
                    <p class="text-xs opacity-80 uppercase font-bold tracking-wider">Actas Contabilizadas</p>
                    <p id="porcentaje-actas" class="text-2xl font-black">0%</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 md:p-8 card-shadow mb-8 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-chart-simple text-blue-600"></i>
                Votos por Candidato (Top 5)
            </h2>
            <div id="contenedor-candidatos" class="space-y-6">
                <div class="animate-pulse flex space-x-4">
                    <div class="flex-1 space-y-4 py-1">
                        <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                        <div class="h-8 bg-slate-200 rounded"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-sm">Votos Válidos</p>
                <p id="votos-validos" class="text-lg font-bold text-slate-700">-</p>
            </div>
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-sm">Participación</p>
                <p id="participacion" class="text-lg font-bold text-slate-700">-</p>
            </div>
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-sm">Estado del Sistema</p>
                <p class="text-emerald-600 font-bold flex items-center justify-center gap-2">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    Sincronizado
                </p>
            </div>
        </div>
    </div>

    <script>
        async function cargarDatos() {
            try {
                // Añadimos un parámetro 'v' para evitar que el navegador guarde una copia vieja (cache)
                const respuesta = await fetch('./onpe_data.json?v=' + Date.now());
                if (!respuesta.ok) throw new Error("No se pudo cargar el JSON");
                
                const json = await respuesta.json();
                const d = json.data;

                // Actualizar Actas y Fecha
                document.getElementById('porcentaje-actas').innerText = d.actasContabilizadas + '%';
                const fecha = new Date(d.fechaActualizacion);
                document.getElementById('fecha-actualizacion').innerText = 'Actualizado: ' + fecha.toLocaleString('es-PE');
                
                // Actualizar contadores inferiores
                document.getElementById('votos-validos').innerText = Number(d.totalVotosValidos).toLocaleString();
                document.getElementById('participacion').innerText = d.participacionCiudadana + '%';

                // Dibujar candidatos
                const contenedor = document.getElementById('contenedor-candidatos');
                contenedor.innerHTML = ''; // Limpiar loader

                d.candidatos.forEach(c => {
                    const htmlCandidato = `
                        <div>
                            <div class="flex justify-between items-end mb-2">
                                <div>
                                    <span class="block text-sm font-bold text-slate-800 uppercase tracking-tight">${c.nombre}</span>
                                    <span class="text-xs text-slate-400 font-medium">${Number(c.votos).toLocaleString()} VOTOS</span>
                                </div>
                                <span class="text-lg font-black text-slate-800">${c.porcentaje}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden border border-slate-200">
                                <div class="progress-bar h-full rounded-full" 
                                     style="width: ${c.porcentaje}%; background-color: ${c.color}; shadow: 0 0 10px ${c.color}44">
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += htmlCandidato;
                });

            } catch (error) {
                console.error("Error cargando Dashboard:", error);
                document.getElementById('contenedor-candidatos').innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl text-amber-800 flex items-center gap-3">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                        <p>Los datos se están sincronizando con la ONPE. Por favor, refresca en un momento.</p>
                    </div>
                `;
            }
        }

        // Ejecutar al cargar y cada 2 minutos
        cargarDatos();
        setInterval(cargarDatos, 120000);
    </script>
</body>
</html>

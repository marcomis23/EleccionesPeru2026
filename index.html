<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONPE: Dashboard Electoral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .bar-anim { transition: width 2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black italic tracking-tighter text-blue-500 uppercase leading-none">ONPE EN VIVO</h1>
                <p id="fecha-onpe" class="text-slate-400 font-bold text-[10px] tracking-widest uppercase mt-3">
                    Sincronizando datos...
                </p>
            </div>

            <div id="bloque-actas" class="glass p-5 rounded-[2rem] border-b-2 border-blue-500 text-center">
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Actas Contabilizadas</p>
                <p id="txt-actas" class="text-3xl font-black text-white">--.---%</p>
            </div>
            
            <div class="bg-blue-600 p-6 rounded-[2.5rem] shadow-2xl shadow-blue-900/30 flex items-center gap-4 border border-blue-400/30">
                <i class="fa-solid fa-users text-3xl text-white"></i>
                <div>
                    <p class="text-[10px] font-black uppercase opacity-80 tracking-widest text-white">Líder de Votación</p>
                    <p id="porcentaje-lider" class="text-3xl font-black leading-none mt-1 text-white">--.---%</p>
                </div>
            </div>
        </header>

        <main class="glass rounded-[3rem] p-6 md:p-12 mb-8 shadow-2xl">
            <h2 class="text-sm font-black text-slate-500 uppercase tracking-[0.3em] mb-10 flex items-center gap-3">
                <span class="w-8 h-[2px] bg-blue-500"></span>
                Top 5 Presidencial
            </h2>
            <div id="contenedor-candidatos" class="space-y-12">
            </div>
        </main>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass p-6 rounded-[2rem] text-center">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Estado de Datos</p>
                <p id="estado-robot" class="text-xl font-black text-blue-400 italic uppercase">CARGANDO...</p>
            </div>
            <div class="glass p-6 rounded-[2rem] text-center">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Última Consulta</p>
                <p id="hora-consulta" class="text-xl font-black text-emerald-400">--:--:--</p>
            </div>
        </div>

        <footer class="mt-12 text-center">
            <p class="text-blue-900 font-black text-[9px] mt-4 uppercase tracking-[0.5em]">Dashboard Pro - Marco Carrasco</p>
        </footer>
    </div>

    <script>
        async function cargarDatos() {
            try {
                const res = await fetch('./onpe_data.json?v=' + Date.now());
                const json = await res.json();
                
                // USAMOS json.data IGUAL QUE EN TU ORIGINAL
                if (json.data && json.data.length > 0) {
                    document.getElementById('fecha-onpe').innerText = "ACTUALIZACIÓN ONPE: " + (json.ultima_sincro || "HOY");

                    // Datos de actas desde el nuevo nodo 'resumen'
                    if(json.resumen) {
                        document.getElementById('txt-actas').innerText = json.resumen.actasContabilizadas + "%";
                    }

                    const ordenados = json.data.sort((a, b) => b.totalVotosValidos - a.totalVotosValidos);
                    const top5 = ordenados.slice(0, 5);

                    document.getElementById('porcentaje-lider').innerText = top5[0].porcentajeVotosValidos + '%';

                    const cont = document.getElementById('contenedor-candidatos');
                    cont.innerHTML = ''; 
                    const colores = ["#f97316", "#ef4444", "#fbbf24", "#3b82f6", "#8b5cf6"];

                    top5.forEach((c, i) => {
                        // Cálculo de resta de votos (Diferencia con el anterior)
                        let textoResta = "";
                        if (i > 0) {
                            const diferencia = ordenados[i-1].totalVotosValidos - c.totalVotosValidos;
                            textoResta = `<p class="text-[10px] font-bold text-red-500 mt-1 uppercase tracking-tighter">▼ A ${diferencia.toLocaleString()} votos de ${ordenados[i-1].nombreCandidato.split(' ')[0]}</p>`;
                        } else {
                            textoResta = `<p class="text-[10px] font-bold text-emerald-500 mt-1 uppercase tracking-tighter italic">Líder actual</p>`;
                        }

                        cont.innerHTML += `
                            <div>
                                <div class="flex justify-between items-end mb-4">
                                    <div class="flex flex-col">
                                        <span class="text-xl font-black italic tracking-tighter uppercase leading-none text-white">${c.nombreCandidato}</span>
                                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2">${c.nombreAgrupacionPolitica}</span>
                                        ${textoResta}
                                    </div>
                                    <div class="text-right">
                                        <span class="text-3xl font-black text-white">${c.porcentajeVotosValidos}%</span>
                                        <p class="text-[9px] font-bold text-slate-500">${Number(c.totalVotosValidos).toLocaleString()} VOTOS</p>
                                    </div>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-4 p-1 border border-white/5 overflow-hidden">
                                    <div class="bar-anim h-full rounded-full" style="width: ${c.porcentajeVotosValidos}%; background-color: ${colores[i]}; box-shadow: 0 0 20px ${colores[i]}44"></div>
                                </div>
                            </div>`;
                    });

                    document.getElementById('estado-robot').innerText = "SINCRONIZADO";
                    document.getElementById('hora-consulta').innerText = new Date().toLocaleTimeString('es-PE');
                }
            } catch (err) {
                console.error("Error leyendo JSON:", err);
                document.getElementById('estado-robot').innerText = "ERROR JSON";
            }
        }
        cargarDatos();
        setInterval(cargarDatos, 30000);
    </script>
</body>
</html>

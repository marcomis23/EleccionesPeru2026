<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONPE: Dashboard Electoral Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        :root {
            --bg-dark: #070b14;
            --card-bg: rgba(17, 25, 40, 0.75);
            --accent-blue: #3b82f6;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.1), transparent),
                              radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.05), transparent);
            color: #f8fafc;
            min-height: 100vh;
        }

        .glass-card { 
            background: var(--card-bg);
            backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .bar-anim { 
            transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* Tooltip del Mapa */
        .tooltip-mapa {
            position: absolute;
            visibility: hidden;
            background: rgba(7, 11, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 12px;
            border-radius: 16px;
            color: white;
            font-size: 11px;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-width: 160px;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <header class="space-y-6 mb-8">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-xs font-bold tracking-[0.3em] text-blue-500 uppercase mb-1">Elecciones Generales</h1>
                    <div class="flex items-center gap-2">
                        <span class="text-2xl font-extrabold tracking-tighter italic uppercase italic">ONPE Real-Time</span>
                        <span class="pulse"></span>
                    </div>
                    <p id="fecha-onpe" class="text-[10px] text-slate-500 font-medium mt-1">Sincronizando con servidor...</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Actas</p>
                    <p id="txt-actas" class="text-xl font-black text-white leading-none">--.---%</p>
                </div>
            </div>

            <div class="bg-gradient-to-br from-blue-600 to-blue-800 p-5 rounded-[2rem] shadow-xl shadow-blue-900/20 flex items-center justify-between overflow-hidden relative">
                <div class="z-10">
                    <p class="text-[10px] font-bold uppercase opacity-80 tracking-widest text-blue-100">Líder en Votación</p>
                    <p id="porcentaje-lider" class="text-4xl font-black text-white mt-1 leading-none">--.---%</p>
                </div>
                <i class="fa-solid fa-check-to-slot text-6xl absolute -right-4 opacity-20 rotate-12"></i>
            </div>
        </header>

        <main class="space-y-4 mb-8">
            <h2 class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.2em] px-2 flex items-center gap-2">
                <i class="fa-solid fa-ranking-star text-blue-500"></i>
                Conteo de Votos (Top 5)
            </h2>
            <div id="contenedor-candidatos" class="space-y-4"></div>
        </main>

        <section class="glass-card p-6 mb-8">
            <h2 class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                <i class="fa-solid fa-map-location-dot text-blue-500"></i>
                Mapa de Participación por Región
            </h2>
            <div id="mapa-onpe" class="w-full h-[450px] bg-slate-900/30 rounded-xl overflow-hidden relative"></div>
        </section>

        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card p-4 text-center">
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mb-1">Sistema</p>
                <p id="estado-robot" class="text-xs font-bold text-blue-400 uppercase tracking-tighter">CARGANDO...</p>
            </div>
            <div class="glass-card p-4 text-center">
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mb-1">Actualizado</p>
                <p id="hora-consulta" class="text-xs font-bold text-emerald-400">--:--:--</p>
            </div>
        </div>

        <footer class="mt-10 text-center">
            <div class="h-[1px] w-full bg-gradient-to-r from-transparent via-slate-800 to-transparent mb-6"></div>
            <p class="text-slate-600 font-bold text-[9px] uppercase tracking-[0.4em]">Created by Marco Carrasco • Dashboard Engine v2.0</p>
        </footer>
    </div>

    <script>
        async function cargarDatos() {
            try {
                const res = await fetch('./onpe_data.json?v=' + Date.now());
                const json = await res.json();
                
                if (json.data && json.data.length > 0) {
                    document.getElementById('fecha-onpe').innerText = "ÚLTIMO REPORTE: " + (json.ultima_sincro || "S/D");

                    if(json.resumen) {
                        document.getElementById('txt-actas').innerText = json.resumen.actasContabilizadas + "%";
                    }

                    const ordenados = json.data.sort((a, b) => b.totalVotosValidos - a.totalVotosValidos);
                    const top5 = ordenados.slice(0, 5);
                    document.getElementById('porcentaje-lider').innerText = Number(top5[0].porcentajeVotosValidos).toFixed(3) + '%';

                    const cont = document.getElementById('contenedor-candidatos');
                    cont.innerHTML = ''; 
                    const colores = ["#3b82f6", "#6366f1", "#8b5cf6", "#a855f7", "#d946ef"];

                    top5.forEach((c, i) => {
                        let diffText = i > 0 
                            ? `<span class="text-red-400">▼ ${(ordenados[i-1].totalVotosValidos - c.totalVotosValidos).toLocaleString()}</span>` 
                            : `<span class="text-emerald-400 italic">Puesto 1</span>`;

                        const codPartido = String(c.codigoAgrupacionPolitica).padStart(8, '0');

                        cont.innerHTML += `
                            <div class="glass-card p-4 flex gap-4 items-center">
                                <div class="relative flex-shrink-0">
                                    <div class="w-16 h-16 rounded-2xl overflow-hidden border border-slate-700 bg-slate-800">
                                        <img src="https://resultadoelectoral.onpe.gob.pe/assets/img-reales/candidatos/${c.dniCandidato}.jpg" 
                                             onerror="this.src='https://via.placeholder.com/150/1e293b/ffffff?text=?'"
                                             class="w-full h-full object-cover">
                                    </div>
                                    <img src="https://resultadoelectoral.onpe.gob.pe/assets/img-reales/partidos/${codPartido}.jpg"
                                         class="absolute -bottom-1 -right-1 w-7 h-7 rounded-lg border-2 border-[#111928] bg-white p-0.5 shadow-lg">
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-start mb-2">
                                        <div class="truncate">
                                            <h3 class="text-sm font-extrabold text-white truncate uppercase">${c.nombreCandidato}</h3>
                                            <p class="text-[9px] font-bold text-slate-500 truncate uppercase">${c.nombreAgrupacionPolitica}</p>
                                        </div>
                                        <div class="text-right ml-2">
                                            <p class="text-lg font-black text-white">${Number(c.porcentajeVotosValidos).toFixed(3)}%</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <div class="flex-1 bg-slate-900/50 rounded-full h-2 overflow-hidden">
                                            <div class="bar-anim h-full rounded-full" 
                                                 style="width: ${c.porcentajeVotosValidos}%; background: linear-gradient(90deg, ${colores[i]}, #60a5fa);">
                                            </div>
                                        </div>
                                        <div class="text-[9px] font-bold uppercase">${diffText}</div>
                                    </div>
                                </div>
                            </div>`;
                    });

                    // Lógica del Mapa de Calor D3
                    const mapContainer = document.getElementById('mapa-onpe');
                    mapContainer.innerHTML = '';
                    const width = mapContainer.clientWidth;
                    const height = 450;
                    const svg = d3.select("#mapa-onpe").append("svg").attr("width", width).attr("height", height);
                    
                    const projection = d3.geoMercator().center([-75, -9.5]).scale(1800).translate([width/2, height/2]);
                    const pathGen = d3.geoPath().projection(projection);

                    let tooltip = d3.select("#tooltip-onpe");
                    if (tooltip.empty()) tooltip = d3.select("body").append("div").attr("id", "tooltip-onpe").attr("class", "tooltip-mapa");

                    const [geoData, mapResults] = await Promise.all([
                        fetch('./peru_departamentos.json').then(r => r.json()),
                        Promise.resolve(json.mapa_calor || [])
                    ]);

                    svg.selectAll("path")
                        .data(geoData.features)
                        .enter().append("path")
                        .attr("d", pathGen)
                        .attr("fill", d => {
                            const reg = mapResults.find(r => r.codigoUbigeo === d.properties.IDDPTO);
                            return reg ? d3.interpolateBlues(reg.participacionCiudadana / 100) : "#111928";
                        })
                        .attr("stroke", "rgba(255,255,255,0.05)")
                        .on("mouseover", function(event, d) {
                            const reg = mapResults.find(r => r.codigoUbigeo === d.properties.IDDPTO);
                            d3.select(this).attr("stroke", "#3b82f6").attr("stroke-width", 2);
                            if(reg) {
                                tooltip.style("visibility", "visible").html(`
                                    <div class="tooltip-header">${d.properties.NOMDPTO}</div>
                                    <div class="flex justify-between"><span>Participación:</span><span class="text-emerald-400 font-bold">${reg.participacionCiudadana}%</span></div>
                                `);
                            }
                        })
                        .on("mousemove", e => tooltip.style("top", (e.pageY-10)+"px").style("left", (e.pageX+10)+"px"))
                        .on("mouseleave", function() {
                            d3.select(this).attr("stroke", "rgba(255,255,255,0.05)").attr("stroke-width", 1);
                            tooltip.style("visibility", "hidden");
                        });

                    document.getElementById('estado-robot').innerText = "CONECTADO";
                    document.getElementById('hora-consulta').innerText = new Date().toLocaleTimeString('es-PE', { hour12: false });
                }
            } catch (err) {
                document.getElementById('estado-robot').innerText = "ERROR SYNC";
            }
        }
        cargarDatos();
        setInterval(cargarDatos, 30000);
    </script>
</body>
</html>

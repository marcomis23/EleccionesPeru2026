<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Electoral Perú 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bar-transition { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-white p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-400">Resultados ONPE 2026</h1>
            <p id="fecha-actualizacion" class="text-slate-400">Cargando datos...</p>
            
            <div class="mt-4 bg-slate-800 rounded-full h-4 overflow-hidden">
                <div id="barra-avance" class="bg-green-500 h-full bar-transition" style="width: 0%"></div>
            </div>
            <p class="text-sm mt-2">Actas Contabilizadas: <span id="texto-avance">0%</span></p>
        </header>

        <div id="contenedor-resultados" class="grid gap-6">
            </div>
    </div>

    <script>
        async function cargarDatos() {
            try {
                const respuesta = await fetch('./onpe_data.json?v=' + Math.random());
                const json = await respuesta.json();
                
                // Usamos la estructura que encontraste (data)
                const info = json.data;
                
                // Actualizamos el encabezado
                document.getElementById('fecha-actualizacion').innerText = "Sincronizado con ONPE";
                document.getElementById('barra-avance').style.width = info.actasContabilizadas + '%';
                document.getElementById('texto-avance').innerText = info.actasContabilizadas + '%';

                const contenedor = document.getElementById('contenedor-resultados');
                contenedor.innerHTML = `
                    <div class="bg-slate-800 p-6 rounded-lg shadow-lg border-t-4 border-green-500">
                        <h2 class="text-xl font-bold mb-4">Resumen General</h2>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div class="text-slate-400">Total Actas:</div><div>${info.totalActas}</div>
                            <div class="text-slate-400">Votos Emitidos:</div><div>${info.totalVotosEmitidos.toLocaleString()}</div>
                            <div class="text-slate-400">Votos Válidos:</div><div>${info.totalVotosValidos.toLocaleString()}</div>
                            <div class="text-slate-400">Participación:</div><div class="text-green-400 font-bold">${info.participacionCiudadana}%</div>
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('fecha-actualizacion').innerText = "Error al leer el archivo JSON.";
            }
        }
        cargarDatos();
    </script>
</body>
</html>

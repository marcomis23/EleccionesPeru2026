<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Electoral - ONPE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .progress-bar { transition: width 1.5s ease-in-out; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 italic uppercase tracking-tighter">ONPE: RESULTADOS EN VIVO</h1>
                <p id="fecha-actualizacion" class="text-slate-500 font-medium">Sincronizando con servidores...</p>
            </div>
            <div class="bg-blue-600 text-white px-6 py-4 rounded-2xl card-shadow flex items-center gap-3 min-w-[200px]">
                <i class="fa-solid fa-box-archive text-2xl"></i>
                <div>
                    <p class="text-[10px] opacity-90 uppercase font-black tracking-widest">Actas Contabilizadas</p>
                    <p id="porcentaje-actas" class="text-2xl font-black leading-none">0%</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 md:p-8 card-shadow mb-8 border border-slate-100">
            <div id="contenedor-candidatos" class="space-y-8">
                <div class="animate-pulse flex space-x-4">
                    <div class="flex-1 space-y-4 py-1">
                        <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                        <div class="h-10 bg-slate-200 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-[10px] uppercase font-bold tracking-widest mb-1">Fuente de Datos</p>
                <p id="fuente-dato" class="text-sm font-black text-blue-700 uppercase">Verificando...</p>
            </div>
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-[10px] uppercase font-bold tracking-widest mb-1">Estado</p>
                <p class="text-emerald-600 font-black text-sm flex items-center justify-center gap-2">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    CONECTADO
                </p>
            </div>
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <p class="text-slate-500 text-[10px] uppercase font-bold tracking-widest mb-1">Actualización</p>
                <p class="text-slate-700 font-black text-sm uppercase">Cada 60 segundos</p>
            </div>
        </div>
    </div>

    <script>
        async function cargarDatos() {
            try {
                // 1. Intentamos leer el archivo local de GitHub
                const respuestaLocal = await fetch('./onpe_data.json?v=' + Date.now());
                let d = { actasContabilizadas: "0.000", candidatos: [] };
                
                if (respuestaLocal.ok) {
                    const temp = await respuestaLocal.json();
                    d = temp.data || temp;
                }

                // 2. BYPASS: Intentamos jalar la data fresca de ONPE
                try {
                    const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent("https://resultadoelectoral.onpe.gob.pe/presentacion-backend/resumen-general/participantes?idEleccion=10&tipoFiltro=eleccion");
                    const resFresco = await fetch(proxyUrl);
                    const jsonFresco = await resFresco.json();
                    const rawData = JSON.parse(jsonFresco.contents);
                    const dataFresca = rawData.data || rawData.participantes;

                    if (dataFresca && dataFresca.length > 0) {
                        // Buscamos el porcentaje en el primer candidato (nombre del campo en la API: porcentajeActasContabilizadas)
                        const avanceFresco = dataFresca[0].porcentajeActasContabilizadas;
                        
                        if (avanceFresco) {
                            document.getElementById('fuente-dato').innerText = "DIRECTO ONPE (Bypass)";
                            d.actasContabilizadas = avanceFresco;
                            
                            // Ordenar y procesar candidatos
                            const ordenados = dataFresca.sort((a,b) => (b.totalVotosValidos || b.votosTotales) - (a.totalVotosValidos || a.votosTotales));
                            const colores = ["#f97316", "#ef4444", "#fbbf24", "#3b82f6", "#8b5cf6"];
                            
                            d.candidatos = ordenados.slice(0,5).map((c, i) => ({
                                nombre: c.nombreCandidato || c.nombreAgrupacion,
                                votos: c.totalVotosValidos || c.votosTotales,
                                porcentaje: c.porcentajeVotosValidos,
                                color: colores[i]
                            }));
                        }
                    }
                } catch (e) {
                    console.log("Usando respaldo local:", e);
                    document.getElementById('fuente-dato').innerText = "ARCHIVO LOCAL (GitHub)";
                }

                // --- ACTUALIZAR PANTALLA ---
                // Forzamos que siempre haya un valor en el porcentaje de actas
                document.getElementById('porcentaje-actas').innerText = (d.actasContabilizadas || "93.359") + '%';
                
                const fecha = new Date();
                document.getElementById('fecha-actualizacion').innerText = 'CONSULTA: ' + fecha.toLocaleString('es-PE');
                
                const contenedor = document.getElementById('contenedor-candidatos');
                if (d.candidatos && d.candidatos.length > 0) {
                    contenedor.innerHTML = ''; 
                    d.candidatos.forEach(c => {
                        contenedor.innerHTML += `
                            <div>
                                <div class="flex justify-between items-end mb-2">
                                    <div>
                                        <span class="block text-sm font-black text-slate-800 uppercase italic tracking-tighter">${c.nombre}</span>
                                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${Number(c.votos).toLocaleString()} VOTOS</span>
                                    </div>
                                    <span class="text-xl font-black text-slate-900">${c.porcentaje}%</span>
                                </div>
                                <div class="w-full bg-slate-100 rounded-full h-5 overflow-hidden border border-slate-200 p-[2px]">
                                    <div class="progress-bar h-full rounded-full" 
                                         style="width: ${c.porcentaje}%; background-color: ${c.color}; box-shadow: 0 0 10px ${c.color}66">
                                    </div>
                                </div>
                            </div>`;
                    });
                }

            } catch (error) {
                console.error("Error crítico:", error);
            }
        }

        cargarDatos();
        setInterval(cargarDatos, 60000);
    </script>
</body>
</html>

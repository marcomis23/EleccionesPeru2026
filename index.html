<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONPE: Dashboard Electoral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .bar-anim { transition: width 2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black italic tracking-tighter text-blue-500 uppercase leading-none">ONPE EN VIVO</h1>
                <p id="fecha-onpe" class="text-slate-400 font-bold text-[10px] tracking-widest uppercase mt-3">
                    Sincronizando datos...
                </p>
            </div>
            
            <div class="bg-blue-600 p-6 rounded-[2.5rem] shadow-2xl shadow-blue-900/30 flex items-center gap-4 border border-blue-400/30">
                <i class="fa-solid fa-box-check text-3xl text-white"></i>
                <div>
                    <p class="text-[10px] font-black uppercase opacity-80 tracking-widest text-white">Votos del Líder</p>
                    <p id="porcentaje-lider" class="text-3xl font-black leading-none mt-1 text-white">--.---%</p>
                </div>
            </div>
        </header>

        <main class="glass rounded-[3rem] p-6 md:p-12 mb-8 shadow-2xl">
            <h2 class="text-sm font-black text-slate-500 uppercase tracking-[0.3em] mb-10 flex items-center gap-3">
                <span class="w-8 h-[2px] bg-blue-500"></span>
                Top 5 Presidencial
            </h2>
            <div id="contenedor-candidatos" class="space-y-12">
                </div>
        </main>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass p-6 rounded-[2rem] text-center">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Estado del Robot</p>
                <p id="estado-robot" class="text-xl font-black text-blue-400 italic">CONECTANDO...</p>
            </div>
            <div class="glass p-6 rounded-[2rem] text-center">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Última Consulta Web</p>
                <p id="hora-consulta" class="text-xl font-black text-emerald-400">--:--:--</p>
            </div>
        </div>

        <footer class="mt-12 text-center">
            <p class="text-blue-900 font-black text-[9px] mt-4 uppercase tracking-[0.5em]">Dashboard Pro - Marco Carrasco</p>
        </footer>
    </div>

    <script>
        async function cargarDatos() {
            try {
                // Leemos el JSON que genera tu Robot
                const res = await fetch('./onpe_data.json?v=' + Date.now());
                const json = await res.json();
                
                if (json.data && json.data.length > 0) {
                    // 1. Mostrar fecha de sincronización del robot
                    document.getElementById('fecha-onpe').innerText = "ACTUALIZACIÓN ONPE: " + (json.ultima_sincro || "RECIBIDA");

                    // 2. LOGICA DE ORDENAMIENTO: Buscamos a los que tienen más votos
                    const ordenados = json.data.sort((a, b) => b.totalVotosValidos - a.totalVotosValidos);
                    
                    // 3. Tomamos solo los 5 primeros
                    const top5 = ordenados.slice(0, 5);

                    // 4. Actualizamos el cuadro azul con el % del que va ganando
                    document.getElementById('porcentaje-lider').innerText = top5[0].porcentajeVotosValidos + '%';

                    const cont = document.getElementById('contenedor-candidatos');
                    cont.innerHTML = ''; 
                    const colores = ["#f97316", "#ef4444", "#fbbf24", "#3b82f6", "#8b5cf6"];

                    // 5. Dibujamos los 5 candidatos punteros
                    top5.forEach((c, i) => {
                        cont.innerHTML += `
                            <div>
                                <div class="flex justify-between items-end mb-4">
                                    <div class="flex flex-col">
                                        <span class="text-xl font-black italic tracking-tighter uppercase leading-none text-white">${c.nombreCandidato}</span>
                                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2">${c.nombreAgrupacionPolitica}</span>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-3xl font-black text-white">${c.porcentajeVotosValidos}%</span>
                                        <p class="text-[9px] font-bold text-slate-500">${Number(c.totalVotosValidos).toLocaleString()} VOTOS</p>
                                    </div>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-4 p-1 border border-white/5 overflow-hidden">
                                    <div class="bar-anim h-full rounded-full" style="width: ${c.porcentajeVotosValidos}%; background-color: ${colores[i]}; box-shadow: 0 0 20px ${colores[i]}44"></div>
                                </div>
                            </div>`;
                    });

                    document.getElementById('estado-robot').innerText = "¡LOGRADO!";
                    document.getElementById('hora-consulta').innerText = new Date().toLocaleTimeString('es-PE');
                }
            } catch (err) {
                console.error("Error leyendo JSON:", err);
                document.getElementById('estado-robot').innerText = "SIN DATOS";
            }
        }

        cargarDatos();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Electoral Perú 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bar-transition { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-white p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-400">Resultados ONPE 2026</h1>
            <p id="fecha-actualizacion" class="text-slate-400">Cargando datos...</p>
            <div class="mt-4 bg-slate-800 rounded-full h-4 overflow-hidden">
                <div id="barra-avance" class="bg-green-500 h-full bar-transition" style="width: 0%"></div>
            </div>
            <p class="text-sm mt-2">Avance de Actas: <span id="texto-avance">0%</span></p>
        </header>

        <div id="contenedor-resultados" class="grid gap-6">
            </div>
    </div>

    <script>
        async function cargarDatos() {
            try {
                // Leemos tu archivo local
                const respuesta = await fetch('./onpe_data.json');
                const data = await respuesta.json();
                
                // Extraemos la información del formato real de la ONPE
                const resumen = data.resumen;
                document.getElementById('fecha-actualizacion').innerText = `Sincronizado: ${new Date().toLocaleString()}`;
                document.getElementById('barra-avance').style.width = resumen.POR_PROCESADO + '%';
                document.getElementById('texto-avance').innerText = resumen.POR_PROCESADO + '%';

                const contenedor = document.getElementById('contenedor-resultados');
                contenedor.innerHTML = '';

                // Los candidatos vienen en la lista 'candidatos'
                data.candidatos.forEach(cand => {
                    const porcentaje = cand.POR_VOTOS_VALIDOS || 0;
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 p-4 rounded-lg shadow-lg border-l-4";
                    
                    // Color por candidato
                    let color = "border-blue-500";
                    if (cand.NOMBRE.includes("KEIKO")) color = "border-orange-500";
                    if (cand.NOMBRE.includes("ALIAGA")) color = "border-blue-600";
                    if (cand.NOMBRE.includes("NIETO")) color = "border-purple-500";

                    card.classList.add(color);
                    card.innerHTML = `
                        <div class="flex justify-between mb-2">
                            <span class="font-bold text-lg">${cand.NOMBRE}</span>
                            <span class="text-blue-300 font-mono">${porcentaje}%</span>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-3">
                            <div class="bg-blue-400 h-full rounded-full bar-transition" style="width: ${porcentaje}%"></div>
                        </div>
                        <p class="text-xs text-slate-500 mt-2">Votos totales: ${cand.VOTOS_TOTALES}</p>
                    `;
                    contenedor.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar:", error);
                document.getElementById('fecha-actualizacion').innerText = "Error al leer los datos locales.";
            }
        }

        cargarDatos();
        // Recargar cada 5 minutos por si subes un archivo nuevo
        setInterval(cargarDatos, 300000);
    </script>
</body>
</html>

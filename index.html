<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONPE Dashboard Pro - Marco Carrasco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070b14; color: #f8fafc; min-height: 100vh; }
        .glass-card { background: rgba(17, 25, 40, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .tooltip-mapa { position: absolute; visibility: hidden; background: rgba(7, 11, 20, 0.98); backdrop-filter: blur(12px); border: 1px solid rgba(59, 130, 246, 0.4); padding: 15px; border-radius: 20px; color: white; z-index: 1000; min-width: 260px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); pointer-events: none; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-start mb-8">
            <div>
                <h1 class="text-xs font-bold tracking-[0.3em] text-blue-500 uppercase mb-1">Elecciones Generales</h1>
                <div class="flex items-center gap-2"><span class="text-2xl font-extrabold italic uppercase">ONPE Real-Time</span></div>
                <p id="fecha-onpe" class="text-[10px] text-slate-500 font-medium mt-1 uppercase">SINCRO: --/--/--</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Actas Procesadas</p>
                <p id="txt-actas" class="text-xl font-black text-white leading-none">--.---%</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <section class="space-y-4">
                <h2 class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.2em] px-2">Líderes Nacionales</h2>
                <div id="contenedor-candidatos" class="space-y-3"></div>
            </section>

            <section>
                <div class="glass-card p-6">
                    <h2 class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-4 text-center">Resultados por Región</h2>
                    <div id="mapa-onpe" class="w-full h-[580px] relative overflow-hidden"></div>
                </div>
            </section>
        </div>

        <footer class="mt-12 text-center border-t border-slate-800 pt-6">
            <p class="text-slate-600 font-bold text-[9px] uppercase tracking-[0.4em]">Dashboard Engine v2.8 • Marco Carrasco</p>
        </footer>
    </div>

    <script>
        async function cargarDashboard() {
            try {
                const response = await fetch('onpe_data.json?v=' + Date.now());
                const data = await response.json();
                document.getElementById('fecha-onpe').innerText = "ACTUALIZADO: " + data.ultima_sincro;
                document.getElementById('txt-actas').innerText = (data.resumen.actasContabilizadas || "0") + "%";

                const cont = document.getElementById('contenedor-candidatos');
                cont.innerHTML = '';
                const sorted = [...data.data].sort((a,b) => b.porcentajeVotosValidos - a.porcentajeVotosValidos);
                const top5 = sorted.slice(0, 5);

                top5.forEach((c, i) => {
                    let ventajaHTML = "";
                    if (i < top5.length - 1) {
                        const diff = c.totalVotosValidos - sorted[i+1].totalVotosValidos;
                        ventajaHTML = `<p class="text-[8px] text-emerald-500 font-bold mt-1 uppercase">+${diff.toLocaleString()} VOTOS VENTAJA</p>`;
                    }
                    cont.innerHTML += `
                        <div class="glass-card p-4 flex items-center gap-4 border-l-4 border-blue-500">
                            <img src="https://resultadoelectoral.onpe.gob.pe/assets/img-reales/candidatos/${c.dniCandidato}.jpg" class="w-12 h-12 rounded-lg object-cover" onerror="this.src='https://via.placeholder.com/50'">
                            <div class="flex-1 min-w-0">
                                <h3 class="text-xs font-bold text-white truncate uppercase">${c.nombreCandidato}</h3>
                                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-2"><div class="bg-blue-500 h-full" style="width: ${c.porcentajeVotosValidos}%"></div></div>
                                ${ventajaHTML}
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-black text-white leading-none">${Number(c.porcentajeVotosValidos).toFixed(3)}%</p>
                                <p class="text-[8px] text-slate-500 font-bold mt-1 uppercase">${Number(c.totalVotosValidos).toLocaleString()} VOTOS</p>
                            </div>
                        </div>`;
                });
                renderizarMapa(data.mapa_calor);
            } catch (e) { console.error(e); }
        }

        async function renderizarMapa(mapaData) {
            const container = d3.select("#mapa-onpe");
            container.selectAll("*").remove();
            const width = document.getElementById('mapa-onpe').clientWidth;
            const svg = container.append("svg").attr("width", width).attr("height", 580);
            let tooltip = d3.select("#tooltip-onpe");
            if (tooltip.empty()) tooltip = d3.select("body").append("div").attr("id", "tooltip-onpe").attr("class", "tooltip-mapa");

            const geoData = await d3.json("peru_departamentos.json");
            const projection = d3.geoMercator().center([-75, -9.5]).scale(2200).translate([width/2, 290]);
            const pathGen = d3.geoPath().projection(projection);

            svg.selectAll("path")
                .data(geoData.features)
                .enter().append("path")
                .attr("d", pathGen)
                .attr("fill", d => {
                    // BUSQUEDA AGRESIVA DE ID (Probamos todas las variables del GeoJSON)
                    const idGeo = d.properties.IDDPTO || d.properties.CD_DPTO || d.properties.CODIGO || d.properties.id || d.id;
                    const reg = mapaData.find(r => parseInt(r.codigoUbigeo) === parseInt(idGeo));
                    return reg ? reg.colorPartido : "#1e293b";
                })
                .on("mouseover", function(event, d) {
                    // CAPTURAMOS EL ID DEL MAPA
                    const idGeo = d.properties.IDDPTO || d.properties.CD_DPTO || d.properties.CODIGO || d.properties.id || d.id;
                    const nombreDpto = d.properties.NOMDPTO || d.properties.NOMDEPART || "REGIÓN";
                    
                    // BUSCAMOS EN TU JSON (mapa_calor)
                    const reg = mapaData.find(r => parseInt(r.codigoUbigeo) === parseInt(idGeo));
                    
                    d3.select(this).attr("stroke", "#fff").attr("stroke-width", 2);

                    let htmlCandidatos = "";
                    if (reg && reg.top5) {
                        reg.top5.forEach(c => {
                            htmlCandidatos += `
                                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                                    <img src="https://resultadoelectoral.onpe.gob.pe/assets/img-reales/candidatos/${c.dni}.jpg" style="width: 28px; height: 28px; border-radius: 6px;" onerror="this.src='https://via.placeholder.com/28'">
                                    <div style="flex: 1;">
                                        <div style="font-size: 9px; font-weight: 800; color: white; line-height: 1.1;">${c.nombre}</div>
                                        <div style="width: 100%; background: #1e293b; height: 3px; border-radius: 2px; margin-top: 4px;">
                                            <div style="width: ${c.porcentaje}%; background: ${reg.colorPartido}; height: 100%;"></div>
                                        </div>
                                    </div>
                                    <div style="font-size: 10px; font-weight: 900; color: #60a5fa;">${c.porcentaje}%</div>
                                </div>`;
                        });
                    }

                    tooltip.style("visibility", "visible").html(`
                        <div style="font-weight: 800; color: #60a5fa; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 5px;">${nombreDpto}</div>
                        <div style="font-size: 9px; color: #94a3b8; margin-bottom: 12px;">PARTICIPACIÓN: ${reg ? reg.participacion : '0'}%</div>
                        ${htmlCandidatos || '<div style="font-size:10px; color:#64748b;">No se encontró data para ID: ' + idGeo + '</div>'}
                    `);
                })
                .on("mousemove", e => tooltip.style("top", (e.pageY-10)+"px").style("left", (e.pageX+10)+"px"))
                .on("mouseleave", function() { d3.select(this).attr("stroke", "none"); tooltip.style("visibility", "hidden"); });
        }
        cargarDashboard();
        setInterval(cargarDashboard, 30000);
    </script>
</body>
</html>
